name: Generate contribution snake

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=red&color_dots=%23000000,%23330000,%23660000,%23990000,%23cc0000,%23ff0000
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=red&color_dots=%23000000,%23330000,%23660000,%23990000,%23cc0000,%23ff0000

      - name: Keep snake inside the grid
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          for path in Path("dist").glob("github-contribution-grid-snake*.svg"):
              svg = path.read_text(encoding="utf-8")

              cells = [
                  (int(x), int(y))
                  for x, y in re.findall(r'<rect class="c(?: [^"]*)?" x="(\d+)" y="(\d+)"', svg)
              ]
              if not cells:
                  continue

              min_x = min(x for x, _ in cells)
              max_x = max(x for x, _ in cells)
              min_y = min(y for _, y in cells)
              max_y = max(y for _, y in cells)

              # Add one full row above and one below the contribution grid.
              # The snake animation briefly travels through y=-16, so the
              # extra top row keeps it visually inside a block at all times.
              grid_min_y = min_y - 16
              grid_max_y = max_y + 16

              existing = set(cells)
              rows = range(grid_min_y, grid_max_y + 1, 16)
              cols = range(min_x, max_x + 1, 16)
              missing = [
                  (x, y)
                  for x in cols
                  for y in rows
                  if (x, y) not in existing
              ]
              placeholders = ''.join(
                  f'<rect x="{x}" y="{y}" width="12" height="12" rx="2" ry="2" fill="#000000" stroke="#1b1f230a" stroke-width="1"/>'
                  for x, y in missing
              )

              # Clip the moving snake and its food to the enlarged grid.
              clip_x = min_x - 2
              clip_y = grid_min_y - 2
              clip_w = (max_x - min_x) + 16
              clip_h = (grid_max_y - grid_min_y) + 16
              clip = (
                  f'<defs><clipPath id="gridClip">'
                  f'<rect x="{clip_x}" y="{clip_y}" width="{clip_w}" height="{clip_h}"/>'
                  f'</clipPath></defs>'
              )
              svg = svg.replace('>', '>' + clip, 1)

              # Keep contribution cells black. Preserve only one animated
              # food dot (u0) so there is never a second stray red dot.
              extra_css = (
                  '.c{fill:#000000!important;animation:none!important}'
                  '.u:not(.u0){display:none!important}'
                  '.u.u0{clip-path:url(#gridClip)}'
                  '.s{clip-path:url(#gridClip)}'
              )
              svg = svg.replace('</style>', extra_css + '</style>' + placeholders, 1)

              path.write_text(svg, encoding="utf-8")
          PY

      - name: Publish generated files
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

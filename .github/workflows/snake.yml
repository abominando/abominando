name: Generate contribution snake

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=red&color_dots=%23000000,%23330000,%23660000,%23990000,%23cc0000,%23ff0000
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=red&color_dots=%23000000,%23330000,%23660000,%23990000,%23cc0000,%23ff0000

      - name: Publish generated files
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

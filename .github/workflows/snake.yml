name: Generate contribution snake

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=red&color_dots=%23000000,%23330000,%23660000,%23990000,%23cc0000,%23ff0000
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=red&color_dots=%23000000,%23330000,%23660000,%23990000,%23cc0000,%23ff0000

      - name: Complete contribution grid
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          for path in Path("dist").glob("github-contribution-grid-snake*.svg"):
              svg = path.read_text(encoding="utf-8")
              cells = {
                  (int(x), int(y))
                  for x, y in re.findall(r'<rect class="c" x="(\d+)" y="(\d+)"', svg)
              }

              if not cells:
                  continue

              min_x = min(x for x, _ in cells)
              max_x = max(x for x, _ in cells)
              rows = range(2, 99, 16)
              cols = range(min_x, max_x + 1, 16)

              missing = [
                  (x, y)
                  for x in cols
                  for y in rows
                  if (x, y) not in cells
              ]

              placeholders = ''.join(
                  f'<rect x="{x}" y="{y}" width="12" height="12" rx="2" ry="2" fill="#000000" stroke="#1b1f230a" stroke-width="1"/>'
                  for x, y in missing
              )

              if placeholders:
                  svg = svg.replace('</style>', '</style>' + placeholders, 1)
                  path.write_text(svg, encoding="utf-8")
          PY

      - name: Publish generated files
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

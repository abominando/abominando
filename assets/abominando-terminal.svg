<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 410" width="1200" height="410" role="img" aria-label="ABOMINANDO security terminal banner pure red edition">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#000000"/>
      <stop offset="0.52" stop-color="#050000"/>
      <stop offset="1" stop-color="#0b0000"/>
    </linearGradient>
    <linearGradient id="border" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#330000"/>
      <stop offset="0.5" stop-color="#ff0000"/>
      <stop offset="1" stop-color="#330000"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#ff0000" stroke-width="0.45" opacity="0.11"/>
    </pattern>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="410" rx="18" fill="url(#bg)"/>
  <rect x="1.5" y="1.5" width="1197" height="407" rx="17" fill="none" stroke="url(#border)" stroke-width="2" opacity="0.95"/>
  <rect x="0" y="50" width="1200" height="360" fill="url(#grid)"/>

  <rect width="1200" height="50" rx="18" fill="#020000"/>
  <rect y="31" width="1200" height="19" fill="#020000"/>
  <circle cx="28" cy="25" r="6" fill="#ff0000" opacity="1"/>
  <circle cx="50" cy="25" r="6" fill="#ff0000" opacity="0.65"/>
  <circle cx="72" cy="25" r="6" fill="#ff0000" opacity="0.30"/>
  <text x="600" y="31" text-anchor="middle" font-family="monospace" font-size="13" fill="#ff0000" letter-spacing="2">abominando@security-lab: ~/profile</text>
  <text x="1162" y="31" text-anchor="end" font-family="monospace" font-size="10" fill="#ff0000" letter-spacing="2">SESSION::ACTIVE</text>

  <g text-anchor="middle" font-family="monospace" font-size="70" font-weight="700" filter="url(#glow)">
    <text x="596" y="142" fill="#ff0000" opacity="0.38">ABOMINANDO<animateTransform attributeName="transform" type="translate" values="-2 0;-1 -1;-2 0" dur="0.28s" repeatCount="indefinite"/></text>
    <text x="604" y="142" fill="#ff0000" opacity="0.62">ABOMINANDO<animateTransform attributeName="transform" type="translate" values="2 0;1 1;2 0" dur="0.28s" repeatCount="indefinite"/></text>
    <text x="600" y="142" fill="#ff0000">ABOMINANDO</text>
  </g>

  <text x="600" y="173" text-anchor="middle" font-family="monospace" font-size="13" fill="#ff0000" letter-spacing="4">// APPSEC · DEVSECOPS · REVERSE ENGINEERING</text>

  <g font-family="monospace" font-size="17">
    <text x="75" y="224" fill="#ff0000" opacity="0.70">┌──(abominando㉿lab)-[~/security]</text>
    <text x="75" y="254" fill="#ff0000">└─$ whoami</text>
    <text x="220" y="254" fill="#ff0000" opacity="0.78">self-taught security &amp; software engineering learner</text>

    <text x="75" y="290" fill="#ff0000">└─$ focus --current</text>
    <text x="292" y="290" fill="#ff0000" opacity="0.78">C++ · AppSec · automation · secure software</text>

    <text x="75" y="326" fill="#ff0000">└─$ mode</text>
    <text x="185" y="326" fill="#ff0000">BUILD / BREAK / HARDEN</text>
    <text x="425" y="326" fill="#ff0000" opacity="0.58">// authorized labs only</text>

    <text x="75" y="362" fill="#ff0000">└─$ _</text>
    <rect x="143" y="347" width="10" height="20" fill="#ff0000"><animate attributeName="opacity" values="1;1;0;0" dur="0.9s" repeatCount="indefinite"/></rect>
  </g>

  <g font-family="monospace" font-size="10" letter-spacing="2">
    <text x="75" y="392" fill="#ff0000" opacity="0.48">NODE: BR-SEC</text>
    <text x="255" y="392" fill="#ff0000" opacity="0.68">STATE: LEARNING</text>
    <text x="470" y="392" fill="#ff0000" opacity="0.58">MODE: ENGINEERING</text>
    <text x="1125" y="392" text-anchor="end" fill="#ff0000">ACCESS: GRANTED</text>
  </g>

  <line x1="0" y1="58" x2="1200" y2="58" stroke="#ff0000" stroke-width="1" opacity="0.22">
    <animate attributeName="y1" values="58;402;58" dur="4.8s" repeatCount="indefinite"/>
    <animate attributeName="y2" values="58;402;58" dur="4.8s" repeatCount="indefinite"/>
  </line>
</svg>

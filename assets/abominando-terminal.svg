<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 410" width="1200" height="410" role="img" aria-label="ABOMINANDO security terminal banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#010205"/>
      <stop offset="0.52" stop-color="#020611"/>
      <stop offset="1" stop-color="#071426"/>
    </linearGradient>
    <linearGradient id="border" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#03152f"/>
      <stop offset="0.5" stop-color="#1683ff"/>
      <stop offset="1" stop-color="#03152f"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#1677ff" stroke-width="0.45" opacity="0.10"/>
    </pattern>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="410" rx="18" fill="url(#bg)"/>
  <rect x="1.5" y="1.5" width="1197" height="407" rx="17" fill="none" stroke="url(#border)" stroke-width="2" opacity="0.88"/>
  <rect x="0" y="50" width="1200" height="360" fill="url(#grid)"/>

  <rect width="1200" height="50" rx="18" fill="#01040a"/>
  <rect y="31" width="1200" height="19" fill="#01040a"/>
  <circle cx="28" cy="25" r="6" fill="#56a8ff" opacity="0.95"/>
  <circle cx="50" cy="25" r="6" fill="#1769d2" opacity="0.85"/>
  <circle cx="72" cy="25" r="6" fill="#0a2e61"/>
  <text x="600" y="31" text-anchor="middle" font-family="monospace" font-size="13" fill="#5aa9ff" letter-spacing="2">abominando@security-lab: ~/profile</text>
  <text x="1162" y="31" text-anchor="end" font-family="monospace" font-size="10" fill="#8bc5ff" letter-spacing="2">SESSION::ACTIVE</text>

  <g text-anchor="middle" font-family="monospace" font-size="70" font-weight="700" filter="url(#glow)">
    <text x="596" y="142" fill="#003e8f" opacity="0.85">ABOMINANDO<animateTransform attributeName="transform" type="translate" values="-2 0;-1 -1;-2 0" dur="0.28s" repeatCount="indefinite"/></text>
    <text x="604" y="142" fill="#2588ff" opacity="0.68">ABOMINANDO<animateTransform attributeName="transform" type="translate" values="2 0;1 1;2 0" dur="0.28s" repeatCount="indefinite"/></text>
    <text x="600" y="142" fill="#eaf5ff">ABOMINANDO</text>
  </g>

  <text x="600" y="173" text-anchor="middle" font-family="monospace" font-size="13" fill="#1683ff" letter-spacing="4">// APPSEC · DEVSECOPS · REVERSE ENGINEERING</text>

  <g font-family="monospace" font-size="17">
    <text x="75" y="224" fill="#397fc4">┌──(abominando㉿lab)-[~/security]</text>
    <text x="75" y="254" fill="#dceeff">└─$ whoami</text>
    <text x="220" y="254" fill="#8fc5ff">self-taught security &amp; software engineering learner</text>

    <text x="75" y="290" fill="#dceeff">└─$ focus --current</text>
    <text x="292" y="290" fill="#8fc5ff">C++ · AppSec · automation · secure software</text>

    <text x="75" y="326" fill="#dceeff">└─$ mode</text>
    <text x="185" y="326" fill="#36a0ff">BUILD / BREAK / HARDEN</text>
    <text x="425" y="326" fill="#4b78a8">// authorized labs only</text>

    <text x="75" y="362" fill="#dceeff">└─$ _</text>
    <rect x="143" y="347" width="10" height="20" fill="#1683ff"><animate attributeName="opacity" values="1;1;0;0" dur="0.9s" repeatCount="indefinite"/></rect>
  </g>

  <g font-family="monospace" font-size="10" letter-spacing="2">
    <text x="75" y="392" fill="#24578d">NODE: BR-SEC</text>
    <text x="255" y="392" fill="#4f91d6">STATE: LEARNING</text>
    <text x="470" y="392" fill="#366c9f">MODE: ENGINEERING</text>
    <text x="1125" y="392" text-anchor="end" fill="#78b9ff">ACCESS: GRANTED</text>
  </g>

  <line x1="0" y1="58" x2="1200" y2="58" stroke="#1683ff" stroke-width="1" opacity="0.18">
    <animate attributeName="y1" values="58;402;58" dur="4.8s" repeatCount="indefinite"/>
    <animate attributeName="y2" values="58;402;58" dur="4.8s" repeatCount="indefinite"/>
  </line>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="1000" height="420" role="img" aria-label="Nando security learning roadmap">
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000000"/>
      <stop offset="1" stop-color="#090000"/>
    </linearGradient>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#FF0000" opacity="0.025"/>
    </pattern>
    <filter id="redGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="1" y="1" width="998" height="418" rx="16" fill="url(#panel)" stroke="#FF0000" stroke-opacity="0.8" stroke-width="2"/>
  <rect x="1" y="1" width="998" height="418" rx="16" fill="url(#scan)"/>
  <rect x="1" y="1" width="998" height="44" rx="16" fill="#050000"/>
  <rect x="1" y="28" width="998" height="17" fill="#050000"/>

  <circle cx="28" cy="22" r="5" fill="#FF0000" opacity="0.35"/>
  <circle cx="47" cy="22" r="5" fill="#FF0000" opacity="0.65"/>
  <circle cx="66" cy="22" r="5" fill="#FF0000"/>
  <text x="500" y="27" text-anchor="middle" font-family="monospace" font-size="13" fill="#FF0000" letter-spacing="1.5">abominando@security-lab: ~/roadmap</text>

  <text x="58" y="80" font-family="monospace" font-size="17" fill="#FF0000" filter="url(#redGlow)">$ cat learning-path.txt</text>
  <text x="58" y="104" font-family="monospace" font-size="12" fill="#FF0000" opacity="0.7">tracking skills, labs and engineering depth...</text>

  <g font-family="monospace" font-size="14">
    <text x="58" y="140" fill="#FF0000" opacity="0" filter="url(#redGlow)">[NOW]<animate attributeName="opacity" values="0;1;1" keyTimes="0;0.08;1" dur="8s" repeatCount="indefinite"/></text>
    <text x="86" y="166" fill="#FF0000" opacity="0">├─ C++ and low-level fundamentals<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.10;0.16;1" dur="8s" repeatCount="indefinite"/></text>
    <text x="86" y="190" fill="#FF0000" opacity="0">├─ Cybersecurity foundations<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.18;0.24;1" dur="8s" repeatCount="indefinite"/></text>
    <text x="86" y="214" fill="#FF0000" opacity="0">└─ Linux + secure software practices<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.26;0.32;1" dur="8s" repeatCount="indefinite"/></text>

    <text x="550" y="140" fill="#FF0000" opacity="0" filter="url(#redGlow)">[NEXT]<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.38;0.46;1" dur="8s" repeatCount="indefinite"/></text>
    <text x="578" y="166" fill="#FF0000" opacity="0">├─ AppSec labs and tooling<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.48;0.56;1" dur="8s" repeatCount="indefinite"/></text>
    <text x="578" y="190" fill="#FF0000" opacity="0">└─ DevSecOps pipelines<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.58;0.66;1" dur="8s" repeatCount="indefinite"/></text>

    <text x="550" y="226" fill="#FF0000" opacity="0" filter="url(#redGlow)">[EXPLORING]<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.68;0.76;1" dur="8s" repeatCount="indefinite"/></text>
    <text x="578" y="252" fill="#FF0000" opacity="0">├─ Reverse engineering<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.76;0.84;1" dur="8s" repeatCount="indefinite"/></text>
    <text x="578" y="276" fill="#FF0000" opacity="0">└─ Authorized pentest labs<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.84;0.92;1" dur="8s" repeatCount="indefinite"/></text>
  </g>

  <line x1="58" y1="292" x2="942" y2="292" stroke="#FF0000" stroke-opacity="0.3"/>
  <text x="58" y="316" font-family="monospace" font-size="12" fill="#FF0000" opacity="0.8">STATUS:</text>
  <text x="120" y="316" font-family="monospace" font-size="12" fill="#FF0000" filter="url(#redGlow)">LEARNING_IN_PUBLIC</text>
  <rect x="270" y="305" width="7" height="14" fill="#FF0000"><animate attributeName="opacity" values="1;1;0;0" dur="0.9s" repeatCount="indefinite"/></rect>
  <text x="942" y="316" text-anchor="end" font-family="monospace" font-size="11" fill="#FF0000" opacity="0.65">BUILD → TEST → DOCUMENT</text>

  <line x1="58" y1="338" x2="942" y2="338" stroke="#FF0000" stroke-opacity="0.3"/>

  <g font-family="monospace">
    <text x="58" y="363" font-size="13" fill="#FF0000" filter="url(#redGlow)">SELECT NEXT TARGET</text>
    <text x="58" y="389" font-size="13" fill="#FF0000" opacity="0.88">[01] APPSEC</text>
    <text x="245" y="389" font-size="13" fill="#FF0000" opacity="0.88">[02] DEVSECOPS</text>
    <text x="465" y="389" font-size="13" fill="#FF0000" opacity="0.88">[03] REVERSE ENGINEERING</text>
    <text x="942" y="363" text-anchor="end" font-size="10" fill="#FF0000" letter-spacing="1.4" opacity="0.55">COMMUNITY INPUT</text>
    <text x="942" y="389" text-anchor="end" font-size="11" fill="#FF0000">OPEN <animate attributeName="opacity" values="1;0.35;1" dur="1.4s" repeatCount="indefinite"/></text>
    <text x="58" y="410" font-size="10" fill="#FF0000" opacity="0.52">&gt; pick a path below the panel and send the next lab idea</text>
  </g>

  <line x1="1" y1="52" x2="999" y2="52" stroke="#FF0000" stroke-width="1" opacity="0.12">
    <animate attributeName="y1" values="52;412;52" dur="5.8s" repeatCount="indefinite"/>
    <animate attributeName="y2" values="52;412;52" dur="5.8s" repeatCount="indefinite"/>
  </line>
</svg>